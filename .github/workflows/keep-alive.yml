name: Manter Supabase Ativo

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Quiz
        run: |
          curl -s "${{ secrets.QUIZZ_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.QUIZZ_ANON_KEY }}" \
          -o /dev/null

      - name: Ping Raio-X
        run: |
          curl -s "${{ secrets.RAIOX_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.RAIOX_ANON_KEY }}" \
          -o /dev/null

      - name: Ping Diagnostico
        run: |
          curl -s "${{ secrets.DIAG_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.DIAG_ANON_KEY }}" \
          -o /dev/null
      - name: Ping Inscricoes
        run: |
          curl -s "${{ secrets.INSCRICOES_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.INSCRICOES_ANON_KEY }}" \
          -o /dev/null
      - name: Ping Financeiro
        run: |
          curl -s "${{ secrets.FINANCEIRO_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.FINANCEIRO_ANON_KEY }}" \
          -o /dev/null    
