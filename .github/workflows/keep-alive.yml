name: Manter Supabase Ativo

on:
  schedule:
    - cron: "0 12 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Raio-X
        if: always()
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RAIOX_URL }}/rest/v1/dados_app?limit=1" -H "apikey: ${{ secrets.RAIOX_ANON_KEY }}" -H "Authorization: Bearer ${{ secrets.RAIOX_ANON_KEY }}")
          echo "Raio-X respondeu $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi

      - name: Ping Financeiro
        if: always()
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.FINANCEIRO_URL }}/rest/v1/lancamentos?limit=1" -H "apikey: ${{ secrets.FINANCEIRO_ANON_KEY }}" -H "Authorization: Bearer ${{ secrets.FINANCEIRO_ANON_KEY }}")
          echo "Financeiro respondeu $status"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then exit 1; fi
